<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>doc-ingest 系統架構</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · doc-ingest</p>
    <h1>Three containers, one database in the middle</h1>

    <svg viewBox="0 136 1280 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="doc-ingest-architecture-title doc-ingest-architecture-desc">
      <title id="doc-ingest-architecture-title">doc-ingest system architecture</title>
      <desc id="doc-ingest-architecture-desc">Architecture diagram: a client calls the api over HTTP and receives server-sent events; the api and the worker both talk to PostgreSQL with pgvector and pgmq, which is the only place they meet; the worker owns the parser, embedding and storage ports.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: worker image (drawn before arrows and nodes) -->
      <rect x="864" y="184" width="352" height="320" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="992" y="188" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1040" y="197" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">IMAGE: WORKER</text>

      <!-- Zone: api image -->
      <rect x="272" y="184" width="240" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="360" y="188" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="396" y="197" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">IMAGE: API</text>

      <!-- Arrows first (behind boxes). Each edge gets its own attach point (≥12px apart). -->
      <!-- Client → api: HTTP request (upper attach, y=252) -->
      <line x1="208" y1="252" x2="304" y2="252" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- api ⇢ Client: SSE events (lower attach, y=276, dashed return) -->
      <line x1="304" y1="276" x2="208" y2="276" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- api → PostgreSQL: primary flow, one transaction (upper) -->
      <line x1="480" y1="252" x2="576" y2="252" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- PostgreSQL ⇢ api: NOTIFY wake-up (lower, async, open head) -->
      <line x1="576" y1="276" x2="480" y2="276" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <!-- worker → PostgreSQL: pgmq.read + writes (single attach, y=264) -->
      <line x1="944" y1="264" x2="768" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels: mask 6–10px clear of the stroke -->
      <rect x="220" y="232" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="256" y="241" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST · GET</text>
      <rect x="228" y="284" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="256" y="293" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SSE</text>
      <rect x="488" y="232" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="528" y="241" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQL · ONE TX</text>
      <rect x="492" y="284" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="528" y="293" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NOTIFY</text>
      <rect x="796" y="244" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="856" y="253" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PGMQ.READ · SQL</text>

      <!-- Node: Client (external) -->
      <rect x="64" y="232" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="232" width="144" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="72" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="86" y="249" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="136" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
      <text x="136" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Bearer api key</text>

      <!-- Node: api (backend) -->
      <rect x="304" y="232" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="304" y="232" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="312" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="326" y="249" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="392" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">api (NestJS on Bun)</text>
      <text x="392" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:3000 · guard · RLS · LISTEN</text>

      <!-- Node: PostgreSQL (focal) -->
      <rect x="576" y="216" width="192" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="576" y="216" width="192" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="584" y="224" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="602" y="233" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="672" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL 18</text>
      <text x="672" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pgvector · pgmq</text>
      <text x="672" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">documents · jobs · job_events</text>
      <text x="672" y="302" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">q_document_jobs</text>

      <!-- Node: worker (backend) -->
      <rect x="944" y="232" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="944" y="232" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="952" y="240" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="974" y="249" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WORKER</text>
      <text x="1040" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">worker (NestJS on Bun)</text>
      <text x="1040" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">poll · extract · embed · NOTIFY</text>

      <!-- Ports inside the worker zone: containment says "owned by worker", no arrows needed -->
      <rect x="896" y="400" width="96" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="896" y="400" width="96" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="904" y="408" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="920" y="417" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PORT</text>
      <text x="944" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Parser</text>
      <text x="944" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">unpdf</text>

      <rect x="1008" y="400" width="96" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="1008" y="400" width="96" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="1016" y="408" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="1032" y="417" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PORT</text>
      <text x="1056" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Embedding</text>
      <text x="1056" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mock-1536</text>

      <rect x="1120" y="400" width="80" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="1120" y="400" width="80" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="1128" y="408" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="1144" y="417" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PORT</text>
      <text x="1160" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Storage</text>
      <text x="1160" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">./storage</text>

      <!-- Editorial aside -->
      <text x="672" y="360" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">api 與 worker 只在資料庫相遇：佇列、狀態、事件都是資料表。</text>

      <!-- Legend strip -->
      <line x1="64" y1="560" x2="1216" y2="560" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="64" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="64" y="596" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="84" y="604" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Focal — the only shared state</text>
      <rect x="280" y="596" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="604" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Service image</text>
      <rect x="424" y="596" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="444" y="604" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Port (swappable adapter)</text>
      <rect x="616" y="596" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="636" y="604" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">External</text>
      <line x1="728" y1="600" x2="756" y2="600" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="764" y="604" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">HTTP</text>
      <line x1="828" y1="600" x2="856" y2="600" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="864" y="604" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Primary write (one transaction)</text>
      <line x1="1064" y1="600" x2="1092" y2="600" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <text x="1100" y="604" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Async / return</text>
    </svg>
  </div>
</body>
</html>
