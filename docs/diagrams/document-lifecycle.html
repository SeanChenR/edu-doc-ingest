<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>doc-ingest 一份文件的生命週期</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · doc-ingest</p>
    <h1>One document, from POST to completed</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="doc-ingest-lifecycle-title doc-ingest-lifecycle-desc">
      <title id="doc-ingest-lifecycle-title">doc-ingest document lifecycle</title>
      <desc id="doc-ingest-lifecycle-desc">Sequence diagram: the client posts a document, the api writes document, job, idempotency row and queue message in one transaction and answers 202, the client opens the event stream, the worker reads the queue and for each stage updates the job and inserts an event with a NOTIFY, the api re-reads the event row and pushes it over SSE, and after archive the completed event closes the stream.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines: x = 160, 448, 736, 1024 -->
      <line x1="160" y1="120" x2="160" y2="648" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="448" y1="120" x2="448" y2="648" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="736" y1="120" x2="736" y2="648" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="1024" y1="120" x2="1024" y2="648" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- LOOP fragment: one iteration per stage, spans all four lifelines -->
      <rect x="96" y="344" width="1088" height="200" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="96" y="344" width="44" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="118" y="356" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="152" y="356" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[extracting → embedding → ready]</text>

      <!-- Activation bars -->
      <rect x="444" y="160" width="8" height="88" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="1020" y="320" width="8" height="256" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="444" y="424" width="8" height="88" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages (time flows down). y = 160, 200, 240, 280, 320, 384, 424, 464, 504, 568, 616 -->
      <!-- M1 Client → api -->
      <line x1="160" y1="160" x2="444" y2="160" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M2 api → PostgreSQL: one transaction -->
      <line x1="452" y1="200" x2="736" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M3 api → Client: 202 (headline) -->
      <line x1="444" y1="240" x2="160" y2="240" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- M4 Client → api: open event stream -->
      <line x1="160" y1="280" x2="448" y2="280" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M5 worker → PostgreSQL: pgmq.read -->
      <line x1="1020" y1="320" x2="736" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M6 worker → PostgreSQL: UPDATE jobs + INSERT job_events + NOTIFY (one tx) -->
      <line x1="1020" y1="384" x2="736" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M7 PostgreSQL ⇢ api: NOTIFY (async, open head) -->
      <line x1="736" y1="424" x2="452" y2="424" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <!-- M8 api → PostgreSQL: re-read the event row inside withTenant -->
      <line x1="452" y1="464" x2="736" y2="464" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M9 api ⇢ Client: SSE event -->
      <line x1="444" y1="504" x2="160" y2="504" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M10 worker → PostgreSQL: complete + archive -->
      <line x1="1020" y1="568" x2="736" y2="568" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M11 api → Client: completed, then close (headline) -->
      <line x1="448" y1="616" x2="160" y2="616" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Labels: mask 6–10px above the stroke, kept between lifelines -->
      <rect x="220" y="144" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="304" y="154" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /V1/…/DOCUMENTS</text>
      <rect x="500" y="184" width="184" height="12" rx="2" fill="#f5f5f5"/>
      <text x="592" y="194" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ONE TX · DOC + JOB + PGMQ.SEND</text>
      <rect x="252" y="224" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="304" y="234" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">202 · QUEUED</text>
      <rect x="236" y="264" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="304" y="274" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GET /JOBS/:ID/EVENTS</text>
      <rect x="836" y="304" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="880" y="314" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PGMQ.READ</text>
      <rect x="784" y="368" width="192" height="12" rx="2" fill="#f5f5f5"/>
      <text x="880" y="378" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UPDATE JOB + EVENT + NOTIFY</text>
      <rect x="512" y="408" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="592" y="418" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NOTIFY {JOB_ID, EVENT_ID}</text>
      <rect x="524" y="448" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="592" y="458" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SELECT JOB_EVENTS</text>
      <rect x="244" y="488" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="304" y="498" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVENT: PROGRESS</text>
      <rect x="796" y="552" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="880" y="562" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READY + PGMQ.ARCHIVE</text>
      <rect x="220" y="600" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="304" y="610" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVENT: COMPLETED · CLOSE</text>

      <!-- Actors (drawn last) -->
      <rect x="80" y="64" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="64" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="88" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="102" y="81" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="160" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
      <text x="160" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Bearer api key</text>

      <rect x="368" y="64" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="368" y="64" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="376" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="390" y="81" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="448" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">api</text>
      <text x="448" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">guard · withTenant · LISTEN</text>

      <rect x="656" y="64" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="656" y="64" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="664" y="72" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="682" y="81" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="736" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>
      <text x="736" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">jobs · job_events · pgmq</text>

      <rect x="944" y="64" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="944" y="64" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="952" y="72" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="974" y="81" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WORKER</text>
      <text x="1024" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">worker</text>
      <text x="1024" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">poll · lease · JobTransitions</text>

      <!-- Legend strip -->
      <line x1="64" y1="668" x2="1216" y2="668" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="64" y="688" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <line x1="140" y1="684" x2="168" y2="684" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="176" y="688" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">HTTP call</text>
      <line x1="256" y1="684" x2="284" y2="684" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="292" y="688" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">SQL (each arrow is one transaction)</text>
      <line x1="500" y1="684" x2="528" y2="684" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="536" y="688" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">NOTIFY (wake-up only, no payload)</text>
      <line x1="748" y1="684" x2="776" y2="684" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="784" y="688" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">SSE event</text>
      <line x1="872" y1="684" x2="900" y2="684" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="908" y="688" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Headline responses (202, completed)</text>
    </svg>
  </div>
</body>
</html>
